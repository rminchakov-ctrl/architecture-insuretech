http {
    # Определяем зону для ограничения запросов (rate limiting)
    # Называем зону "mylimit", выделяем 10 мегабайт памяти, 
    # устанавливаем среднюю частоту запросов 10r/m (10 запросов в минуту)
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }
    
    server {
        listen 80;
        
        location / {
            # Применяем ограничение запросов к зоне "mylimit"
            # Параметр burst=5 позволяет обрабатывать кратковременные всплески до 5 запросов
            # Параметр nodelay немедленно применяет лимит без задержки для превысивших лимит
            limit_req zone=mylimit burst=5 nodelay;
            
            # Возвращаем ошибку 429 при превышении лимита
            limit_req_status 429;
            
            proxy_pass http://backend_servers;
        }
    }
}